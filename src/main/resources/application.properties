spring.application.name=StockPulse-AI
server.port=8080

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:stockpulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${H2_USERNAME:zycus}
spring.datasource.password=${H2_PASSWORD:1234}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-executor-

# LLM Gateway Configuration
llm.provider=litellm
llm.api-key=sk-SfyNGxhcv7RnQKbZFWX2LQ
llm.model=qwen-cursor
llm.base-url=https://litellm-qc.zycus.net
commerce.advisor.active-strategy=AI_POWERED
